; 示例配置文件 - Windows注册表兼容层
; 此文件展示了如何使用.ini格式配置注册表数据

; [Software] 节包含应用程序设置
[Software]
; 简单的布尔值配置 - 如果被注释则为false，否则为true
EnableFeature
DebugMode=true
LogLevel=3
AutoUpdate=1

; [System] 节包含系统级配置
[System]
; 系统配置项
TimeZone=UTC
Language=en_US
; 禁用的功能
#DisableIPv6

; [Wine] 节用于Wine兼容层
[Wine]
WineVersion=9.0
UseNativeD3D=false
ShowCrashDialog=true
MouseWarpOverride=force

; [Software/MyApp] 嵌套节结构
[Software/MyApp]
Version=1.0.0
Installed=true
LastUsed=2024-01-15
MaxConnections=100
MemoryLimit=512

; [Software/MyApp/Settings] 更深层的嵌套
[Software/MyApp/Settings]
EnableSound=true
Fullscreen=false
VSync=1
Quality=high
; 被禁用的特性
#ExperimentalFeatures

[Network]
AutoDetect=true
UseProxy=false
ProxyHost=
ProxyPort=8080

[Graphics]
AdapterID=1
VSync=true
FPSLimit=60
; 高级设置
#EnableRayTracing
UseHDR=false