[Software/Cmd]
AutoRun = "/etc/profile.d/cmd_init.sh"
MaxHistory = 0x00000064
Prompt = "$P$G"

[Software/Explorer]
ShowHidden = false
DefaultView = "details"
DriveMapping = "/home:D:;/mnt/E:"

[Software/SAS]
ButtonLayout = "Lock;Switch;Logoff;Shutdown"
Timeout = 0x00000005

[Software/UAC]
Timeout = 0x0000001E
AlwaysPrompt = true
PromptMessage = "需要管理员权限才能继续"

[Software/Runbox]
HistoryLimit = 0x00000014
RememberLast = true